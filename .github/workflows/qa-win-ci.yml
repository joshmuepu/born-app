name: QA Windows build (temporary, push to qa-win-ci only, no release)

# Builds an UNSIGNED Windows installer of whatever branch you choose, so the
# owner can try v2 on a real Windows PC. It never creates a release, never
# creates or pushes a tag, and has read-only repository access. It is separate
# from release.yml and does not touch its v1.x.x-only tag gate.
#
# How to run: GitHub -> Actions -> "v2 dev build (manual, no release)" ->
# "Run workflow" -> pick the branch -> Run. When it finishes, open the run and
# download the "v2-dev-windows" artifact at the bottom (kept for 3 days).

on:
  push:
    branches: [qa-win-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # The prebuilt Bible/songs databases are not in git. Without them the app
      # still starts (it seeds from what is available), but the dev build is
      # most useful with them, so build them the same way release.yml does.
      - name: Cache bundled Bible text
        uses: actions/cache@v4
        with:
          path: resources/bible-cache.db
          key: bible-cache-v1-${{ hashFiles('scripts/build-library-db.ts') }}

      - name: Build prebuilt databases
        shell: bash
        continue-on-error: true
        run: |
          npm run build:db
          if [ -f resources/bible-cache.db ]; then export BORN_REUSE_BIBLE=1; fi
          npm run build:library

      # The speech recogniser that ships inside the app (whisper.cpp, MIT) and its English model. Static build: one whisper-cli.exe, no extra DLLs.
      # Not yet run on a real runner - if this step fails, the installer is still built (it just will not time tapes by itself).
      - name: Build the bundled speech recogniser
        shell: bash
        continue-on-error: true
        run: |
          git init "$RUNNER_TEMP/whisper.cpp" && cd "$RUNNER_TEMP/whisper.cpp" && git fetch --depth 1 https://github.com/ggml-org/whisper.cpp 0c7be696371069e0baa2515ed7aa08d5a5473aa6 && git checkout FETCH_HEAD && cd -   # the same revision as the Mac build
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper-build" -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build "$RUNNER_TEMP/whisper-build" --config Release --target whisper-cli -j 4
          mkdir -p resources/whisper/win32-x64
          cp "$RUNNER_TEMP/whisper-build/bin/Release/whisper-cli.exe" resources/whisper/win32-x64/
          curl -L --fail -o resources/whisper/ggml-base.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          echo "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002  resources/whisper/ggml-base.en.bin" | sha256sum -c -

      - name: Build and package (unsigned, not published)
        run: npm run dist:win -- --publish never

      - name: Windows smoke test (packaged app)
        shell: pwsh
        run: ./scripts/smoke-windows-packaged.ps1 -Unpacked dist-installers\win-unpacked

      - name: Upload installer (3 days)
        uses: actions/upload-artifact@v4
        with:
          name: v2-dev-windows
          path: dist-installers/*.exe
          retention-days: 3
          if-no-files-found: error
