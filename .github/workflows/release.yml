name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The pushed tag is the single source of truth for the version. Reject anything
  # that isn't vMAJOR.MINOR.PATCH so a typo can't ship a bad release.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          echo "Tag: $GITHUB_REF_NAME"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH (e.g. v1.0.2)"
            exit 1
          fi

  build-db:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Bible text is fetched from bolls.life (~8 min). Cache it between runs
      # so re-releases only pay that cost when the build script changes.
      - name: Cache bundled Bible text
        uses: actions/cache@v4
        with:
          path: resources/bible-cache.db
          key: bible-cache-v1-${{ hashFiles('scripts/build-library-db.ts') }}

      - name: Install dependencies
        run: npm ci

      - name: Build prebuilt sermon database
        run: npm run build:db

      - name: Build prebuilt library (Bible + songs)
        run: |
          if [ -f resources/bible-cache.db ]; then export BORN_REUSE_BIBLE=1; fi
          npm run build:library

      - name: Upload prebuilt databases
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-db
          path: |
            resources/sermons.db.gz
            resources/library.db.gz
          retention-days: 1

  build:
    needs: build-db
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            pattern: dist-installers/*.dmg
          - os: windows-latest
            script: dist:win
            pattern: dist-installers/*.exe
          - os: ubuntu-latest
            script: dist:linux
            pattern: dist-installers/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Stamp package.json with the tag's version so every artifact name and the
      # in-app "About" version match the release, no manual bump required.
      - name: Set version from tag
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci

      - name: Download prebuilt databases
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-db
          path: resources

      - name: Build and package
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.pattern }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
