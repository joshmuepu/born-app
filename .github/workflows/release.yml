name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual full build + per-platform smoke test with no publish — use this to
  # dry-run the pipeline before pushing a real tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The pushed tag is the single source of truth for the version. Reject anything
  # that isn't vMAJOR.MINOR.PATCH so a typo can't ship a bad release.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Tag: $GITHUB_REF_NAME"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH (e.g. v1.0.2)"
            exit 1
          fi
      - name: Manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "workflow_dispatch — building + smoke-testing, will not publish"

  build-db:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Bible text is fetched from bolls.life (~8 min). Cache it between runs
      # so re-releases only pay that cost when the build script changes.
      - name: Cache bundled Bible text
        uses: actions/cache@v4
        with:
          path: resources/bible-cache.db
          key: bible-cache-v1-${{ hashFiles('scripts/build-library-db.ts') }}

      - name: Install dependencies
        run: npm ci

      - name: Build prebuilt sermon database
        run: npm run build:db

      - name: Build prebuilt library (Bible + songs)
        run: |
          if [ -f resources/bible-cache.db ]; then export BORN_REUSE_BIBLE=1; fi
          npm run build:library

      - name: Upload prebuilt databases
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-db
          path: |
            resources/sermons.db.gz
            resources/library.db.gz
          retention-days: 1

  build:
    needs: build-db
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest       # Apple Silicon runner
            builder_args: --mac --arm64
            pattern: dist-installers/*.dmg
          - name: macOS-x64
            os: macos-13           # Intel runner — native x64 build + smoke test
            builder_args: --mac --x64
            pattern: dist-installers/*.dmg
          - name: windows
            os: windows-latest
            builder_args: --win
            pattern: dist-installers/*.exe
          - name: linux
            os: ubuntu-latest
            builder_args: --linux
            pattern: dist-installers/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Stamp package.json with the tag's version so every artifact name and the
      # in-app "About" version match the release. No-op on a manual run.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci

      - name: Download prebuilt databases
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-db
          path: resources

      - name: Build and package
        run: |
          npm run build
          npx electron-builder ${{ matrix.builder_args }} --publish never

      # ── Smoke test: install/extract the freshly built artifact on this real
      #    target OS, launch it, and confirm the window loads and it stays up. ──
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          DMG=$(ls dist-installers/*.dmg | head -1)
          echo "Testing $DMG"
          MP=$(hdiutil attach "$DMG" -nobrowse -noautoopen | tail -1 | sed 's/.*\(\/Volumes\/.*\)/\1/')
          cp -R "$MP"/*.app /tmp/BORN-smoke.app
          hdiutil detach "$MP" -quiet
          xattr -cr /tmp/BORN-smoke.app
          BIN=$(ls "/tmp/BORN-smoke.app/Contents/MacOS/")
          "/tmp/BORN-smoke.app/Contents/MacOS/$BIN" &
          PID=$!
          LOG="$HOME/Library/Application Support/Branham or Nothing/born.log"
          for i in $(seq 1 30); do
            sleep 1
            if [ -f "$LOG" ] && grep -q "mainWindow did-finish-load" "$LOG"; then OK=1; break; fi
            kill -0 $PID 2>/dev/null || { echo "::error::app exited early"; cat "$LOG" 2>/dev/null; exit 1; }
          done
          [ "${OK:-}" = 1 ] || { echo "::error::window never loaded"; cat "$LOG" 2>/dev/null; kill $PID; exit 1; }
          echo "still running after window load — killing"
          kill $PID
          grep -E "BORN starting|did-finish-load|seed complete|already complete" "$LOG"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem dist-installers\win-unpacked -Recurse -Filter '*.exe' |
                 Where-Object { $_.Name -notmatch 'crashpad|Squirrel' } | Select-Object -First 1
          if (-not $exe) { throw "no unpacked exe found" }
          Write-Host "Testing $($exe.FullName)"
          $p = Start-Process $exe.FullName -PassThru
          $log = "$env:APPDATA\Branham or Nothing\born.log"
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 1
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'mainWindow did-finish-load' -Quiet)) { $ok = $true; break }
            if ($p.HasExited) { Get-Content $log -ErrorAction SilentlyContinue; throw "app exited early (code $($p.ExitCode))" }
          }
          if (-not $ok) { Get-Content $log -ErrorAction SilentlyContinue; Stop-Process -Id $p.Id -Force; throw "window never loaded" }
          Write-Host "window loaded — killing"
          Stop-Process -Id $p.Id -Force
          Get-Content $log | Select-String 'BORN starting|did-finish-load|seed complete|already complete'
          # Sanity-check the NSIS installer is a real, non-trivial PE.
          $setup = Get-ChildItem dist-installers\*.exe | Select-Object -First 1
          if (-not $setup -or $setup.Length -lt 40MB) { throw "installer missing or too small" }
          $bytes = [System.IO.File]::ReadAllBytes($setup.FullName)[0..1]
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "installer is not a PE (no MZ header)" }
          Write-Host "installer OK: $($setup.Name) ($([math]::Round($setup.Length/1MB)) MB)"

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y xvfb libfuse2
          APP=$(ls dist-installers/*.AppImage | head -1)
          chmod +x "$APP"
          xvfb-run -a "$APP" --no-sandbox --appimage-extract-and-run &
          PID=$!
          LOG="$HOME/.config/Branham or Nothing/born.log"
          for i in $(seq 1 30); do
            sleep 1
            if [ -f "$LOG" ] && grep -q "mainWindow did-finish-load" "$LOG"; then OK=1; break; fi
            kill -0 $PID 2>/dev/null || { echo "::error::app exited early"; cat "$LOG" 2>/dev/null; exit 1; }
          done
          [ "${OK:-}" = 1 ] || { echo "::error::window never loaded"; cat "$LOG" 2>/dev/null; kill $PID 2>/dev/null; exit 1; }
          echo "window loaded — killing"
          kill $PID 2>/dev/null || true
          grep -E "BORN starting|did-finish-load|seed complete|already complete" "$LOG"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
