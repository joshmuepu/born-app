<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B6FD1"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#0d1117"/>

  <!-- connecting lines -->
  <line x1="450" y1="280" x2="450" y2="110" stroke="#8B6FD1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="280" x2="450" y2="450" stroke="#8B6FD1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="300" x2="150" y2="200" stroke="#8B6FD1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="300" x2="750" y2="200" stroke="#8B6FD1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Computer (center) -->
  <g transform="translate(360,240)">
    <rect width="180" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="16" y="16" width="148" height="62" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="90" y="52" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">BORN</text>
    <text x="90" y="100" fill="#8b949e" font-size="13" text-anchor="middle">The computer</text>
  </g>

  <!-- Congregation screen (top) -->
  <g transform="translate(345,20)">
    <rect width="210" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="14" y="12" width="182" height="46" rx="3" fill="#000"/>
    <rect x="94" y="58" width="22" height="10" fill="#30363d"/>
    <rect x="74" y="68" width="62" height="6" rx="2" fill="#30363d"/>
    <text x="105" y="88" fill="#8b949e" font-size="13" text-anchor="middle">Congregation screen</text>
  </g>

  <!-- Stage monitor (bottom) -->
  <g transform="translate(355,460)">
    <rect width="190" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="14" y="12" width="162" height="40" rx="3" fill="#000"/>
    <text x="95" y="68" fill="#8b949e" font-size="13" text-anchor="middle">Stage monitor (optional)</text>
  </g>

  <!-- Phone (left) -->
  <g transform="translate(60,100)">
    <rect width="92" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="10" y="14" width="72" height="110" rx="3" fill="#000"/>
    <circle cx="46" cy="137" r="5" fill="#30363d"/>
    <text x="46" y="178" fill="#8b949e" font-size="13" text-anchor="middle">Phone /</text>
    <text x="46" y="195" fill="#8b949e" font-size="13" text-anchor="middle">tablet</text>
    <text x="46" y="213" fill="#565d64" font-size="11" text-anchor="middle">(mobile remote)</text>
  </g>

  <!-- OBS (right) -->
  <g transform="translate(680,90)">
    <rect width="160" height="128" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="14" y="14" width="132" height="62" rx="3" fill="#000"/>
    <polygon points="68,32 68,58 92,45" fill="#30363d"/>
    <text x="80" y="100" fill="#8b949e" font-size="13" text-anchor="middle">OBS / streaming</text>
    <text x="80" y="117" fill="#565d64" font-size="11" text-anchor="middle">(optional)</text>
  </g>

  <text x="450" y="580" fill="#565d64" font-size="12" text-anchor="middle">Diagram — not a screenshot. Only the computer and Congregation screen are required; everything else is optional.</text>
</svg>
