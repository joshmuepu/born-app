<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tape Add — Today</title><style>/* Born Again — design tokens (Phase 1 proposal).
   Namespaced --ba-* so it can sit beside the current App.css variables while
   the prototype is evaluated; Phase 2 migrates the app onto it and retires
   the old names. Dark is the default (dim booth). */


:root,
:root[data-theme='dark'] {
  /* surfaces: 5 steps, each ~+4% lightness; depth comes from step + hairline, not shadow alone */
  --ba-bg-0: #08080a; /* app canvas / behind everything */
  --ba-bg-1: #0f0f12; /* panes */
  --ba-bg-2: #16161a; /* raised: cards, columns */
  --ba-bg-3: #1e1e23; /* hover */
  --ba-bg-4: #27272d; /* pressed / selected */
  --ba-line: #26262c; /* hairline */
  --ba-line-strong: #3a3a42;

  --ba-text-1: #f4f2ee; /* 17.6:1 on bg-0 */
  --ba-text-2: #b2afaa; /* 9.4:1  */
  --ba-text-3: #8a8782; /* 5.4:1 — the floor for any readable text */

  /* v1 identity, kept: Plum is the one action colour */
  --ba-accent: #9a80e6;
  --ba-accent-hi: #ad97f0;
  --ba-accent-lo: #6f56bd;
  --ba-on-accent: #120d1e;
  --ba-accent-wash: rgba(154, 128, 230, 0.14);
  --ba-focus: #c1affa;

  /* v1 content identity, kept: Stone / Sage / Amber (+ Ice for Screens) */
  --ba-sermons: #cfc8ba;
  --ba-bible: #7ab487;
  --ba-songs: #d49a4c;
  --ba-screens: #5db4ea;

  --ba-live: #ff4d4f; /* ON AIR. Red is reserved for live + destructive. */
  --ba-live-wash: rgba(255, 77, 79, 0.14);
  --ba-ok: #4cc17f;
  --ba-warn: #f0983e;
  --ba-danger: #ff5b61;

  --ba-scrim: rgba(4, 4, 6, 0.64);
  --ba-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --ba-shadow-2: 0 8px 24px rgba(0, 0, 0, 0.42), 0 0 0 1px var(--ba-line);
  --ba-shadow-3: 0 24px 64px rgba(0, 0, 0, 0.56), 0 0 0 1px var(--ba-line-strong);
}

:root[data-theme='light'] {
  --ba-bg-0: #f4f1ea;
  --ba-bg-1: #fbfaf7;
  --ba-bg-2: #ffffff;
  --ba-bg-3: #f0ece3;
  --ba-bg-4: #e6e0d3;
  --ba-line: #e3ddcf;
  --ba-line-strong: #cfc7b5;
  --ba-text-1: #1a1814;
  --ba-text-2: #55503f;
  --ba-text-3: #6d6755;
  --ba-accent: #5b3fb0;
  --ba-accent-hi: #4a3294;
  --ba-accent-lo: #7a60c8;
  --ba-on-accent: #ffffff;
  --ba-accent-wash: rgba(91, 63, 176, 0.1);
  --ba-focus: #5b3fb0;
  --ba-sermons: #7d745a;
  --ba-bible: #38703f;
  --ba-songs: #86581a;
  --ba-screens: #1a6aa0;
  --ba-live: #d3202a;
  --ba-live-wash: rgba(211, 32, 42, 0.1);
  --ba-ok: #1b7544;
  --ba-warn: #9a520c;
  --ba-danger: #c22530;
  --ba-scrim: rgba(20, 16, 8, 0.4);
  --ba-shadow-1: 0 1px 2px rgba(20, 16, 8, 0.08);
  --ba-shadow-2: 0 8px 24px rgba(20, 16, 8, 0.1), 0 0 0 1px var(--ba-line);
  --ba-shadow-3: 0 24px 64px rgba(20, 16, 8, 0.18), 0 0 0 1px var(--ba-line-strong);
}

/* High contrast: pure black/white, 2px lines, no translucency. WCAG AAA text. */
:root[data-theme='contrast'] {
  --ba-bg-0: #000;
  --ba-bg-1: #000;
  --ba-bg-2: #0a0a0a;
  --ba-bg-3: #1a1a1a;
  --ba-bg-4: #2e2e2e;
  --ba-line: #8c8c8c;
  --ba-line-strong: #ffffff;
  --ba-text-1: #ffffff;
  --ba-text-2: #ffffff;
  --ba-text-3: #d6d6d6;
  --ba-accent: #c9b6ff;
  --ba-accent-hi: #ffffff;
  --ba-accent-lo: #c9b6ff;
  --ba-on-accent: #000;
  --ba-accent-wash: rgba(201, 182, 255, 0.28);
  --ba-focus: #ffe14d;
  --ba-live: #ff6b6b;
  --ba-live-wash: rgba(255, 107, 107, 0.3);
  --ba-sermons: #ffffff;
  --ba-bible: #8dff9f;
  --ba-songs: #ffcf70;
  --ba-screens: #8fd3ff;
  --ba-shadow-2: 0 0 0 2px var(--ba-line-strong);
  --ba-shadow-3: 0 0 0 2px var(--ba-line-strong);
}

:root {
  /* type: Inter (kept) + JetBrains Mono for codes. Scale ratio ~1.125, UI is
     dense by design; reading text (sermon paragraphs) has its own tier. */
  --ba-font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ba-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --ba-fs-xs: 0.72rem;
  --ba-fs-sm: 0.8rem;
  --ba-fs-md: 0.9rem;
  --ba-fs-lg: 1.02rem;
  --ba-fs-xl: 1.25rem;
  --ba-fs-2xl: 1.6rem;
  --ba-fs-read: 1.18rem; /* sermon / lyric reading pane */
  --ba-lh-tight: 1.25;
  --ba-lh-read: 1.6;
  --ba-tracking-caps: 0.09em;

  /* spacing: 4px base */
  --ba-1: 4px; --ba-2: 8px; --ba-3: 12px; --ba-4: 16px; --ba-5: 24px; --ba-6: 32px; --ba-7: 48px;

  /* radius: slightly rounder than v1 for a softer, premium feel */
  --ba-r-sm: 6px; --ba-r-md: 10px; --ba-r-lg: 14px; --ba-r-pill: 999px;

  /* density: comfortable (default) / compact via [data-density] */
  --ba-row-h: 44px;
  --ba-hit: 40px; /* min interactive target; 48px under [data-touch] */

  /* motion — purposeful, interruptible (CSS transitions, never keyframe locks) */
  --ba-dur-1: 90ms;  /* hover, press */
  --ba-dur-2: 180ms; /* small state change */
  --ba-dur-3: 280ms; /* column slide / panel */
  --ba-ease: cubic-bezier(0.2, 0.7, 0.2, 1);       /* decelerate-in: default */
  --ba-ease-inout: cubic-bezier(0.65, 0, 0.35, 1); /* panel slide */

  /* z layers */
  --ba-z-base: 0;
  --ba-z-pane: 10;
  --ba-z-sticky: 20;
  --ba-z-popover: 40;
  --ba-z-modal: 60;
  --ba-z-toast: 80;
  --ba-z-palette: 90;
}
:root[data-density='compact'] { --ba-row-h: 34px; --ba-hit: 32px; }
:root[data-touch='true'] { --ba-hit: 48px; --ba-row-h: 52px; }

@media (prefers-reduced-motion: reduce) {
  :root { --ba-dur-1: 0ms; --ba-dur-2: 0ms; --ba-dur-3: 0ms; }
}

/* Born Again UX review mockups — shared styles. Tokens are the --ba-* set from docs/design/tokens.css (copied in by build.py). Placeholder content only. */
*{box-sizing:border-box}
html{color-scheme:dark}
html[data-theme='light']{color-scheme:light}
body{margin:0;background:var(--ba-bg-0);color:var(--ba-text-1);font:14px/1.45 var(--ba-font)}
a{color:var(--ba-accent-hi)}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;left:-9999px}

/* page chrome (not part of the app being mocked) */
.page{max-width:1240px;margin:0 auto;padding:28px 24px 70px}
.page h1{font-size:28px;margin:0 0 6px}
.page h2{font-size:21px;margin:34px 0 6px}
.page p.lead{color:var(--ba-text-2);max-width:900px;margin:4px 0 14px}
.topnav{position:sticky;top:0;z-index:50;display:flex;gap:14px;align-items:center;padding:10px 24px;background:var(--ba-bg-1);border-bottom:1px solid var(--ba-line);flex-wrap:wrap}
.topnav a{color:var(--ba-text-2);text-decoration:none;font-size:13.5px}.topnav a:hover,.topnav a.on{color:var(--ba-text-1)}
.topnav .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--ba-line-strong);border-radius:var(--ba-r-md);overflow:hidden}
.seg button{background:var(--ba-bg-2);border:0;padding:6px 12px;font-size:13px;color:var(--ba-text-2)}
.seg button+button{border-left:1px solid var(--ba-line-strong)}
.seg button[aria-pressed='true']{background:var(--ba-accent);color:var(--ba-on-accent);font-weight:600}
.seg.approve button[aria-pressed='true'][data-v='approve']{background:var(--ba-ok);color:#06140d}
.seg.approve button[aria-pressed='true'][data-v='reject']{background:var(--ba-danger);color:#1a0507}
.seg.approve button[aria-pressed='true'][data-v='discuss']{background:var(--ba-warn);color:#1a0d02}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--ba-line-strong);color:var(--ba-text-2);margin-right:5px}
.pill.s{color:var(--ba-ok);border-color:var(--ba-ok)}.pill.m{color:var(--ba-warn);border-color:var(--ba-warn)}.pill.l{color:var(--ba-danger);border-color:var(--ba-danger)}
.pill.hi{background:var(--ba-accent-wash);color:var(--ba-accent-hi);border-color:var(--ba-accent)}
.card{background:var(--ba-bg-2);border:1px solid var(--ba-line);border-radius:var(--ba-r-lg);padding:16px 18px;margin:16px 0}
.card h3{margin:0 0 4px;font-size:17px}
.card .meta{margin:6px 0 10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.stage{background:var(--ba-bg-1);border:1px solid var(--ba-line);border-radius:var(--ba-r-md);padding:10px;overflow:auto}
.stage .lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ba-text-3);margin:0 0 6px}
textarea.note{width:100%;min-height:54px;background:var(--ba-bg-1);color:var(--ba-text-1);border:1px solid var(--ba-line-strong);border-radius:var(--ba-r-sm);padding:8px;font:inherit}
.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:var(--ba-bg-2);border:1px solid var(--ba-line);border-radius:var(--ba-r-md);margin:14px 0;position:sticky;top:48px;z-index:40}
.big{background:var(--ba-accent);color:var(--ba-on-accent);border:0;border-radius:var(--ba-r-md);padding:8px 16px;font-weight:700}
.tgl{display:inline-flex;gap:0}

/* ---- the mocked app ---- */
.app{--w:1366px;width:var(--w);height:768px;display:grid;grid-template-rows:52px 1fr auto;background:var(--ba-bg-0);border:1px solid var(--ba-line-strong);border-radius:8px;overflow:hidden;font-size:13px;position:relative}

.grow{flex:1}
.cluster{display:inline-flex;gap:6px;align-items:center;padding:3px 6px;border:1px solid var(--ba-line-strong);border-radius:12px;background:var(--ba-bg-0)}

.dot{width:8px;height:8px;border-radius:50%;background:var(--ba-text-3);display:inline-block}.dot.live{background:var(--ba-live)}.dot.ok{background:var(--ba-ok)}.dot.warn{background:var(--ba-warn)}

.body{display:grid;grid-template-columns:68px minmax(0,1fr) 340px;min-height:0}
.body.noq{grid-template-columns:68px minmax(0,1fr)}
.rail{display:flex;flex-direction:column;gap:4px;padding:8px 6px;background:var(--ba-bg-1);border-right:1px solid var(--ba-line);overflow:hidden}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:var(--ba-r-md);border:1px solid transparent;background:none;color:var(--ba-text-2);font-size:11px;font-weight:600;position:relative}
.rb svg,.rb .g{font-size:17px;line-height:1}

.rb.on.c-bible{border-color:var(--ba-bible);color:var(--ba-bible)}.rb.on.c-songs{border-color:var(--ba-songs);color:var(--ba-songs)}.rb.on.c-media{border-color:#4fb8a8;color:#4fb8a8}.rb.on.c-queue{border-color:var(--ba-accent);color:var(--ba-accent-hi)}
.rb.on.neutral{border-color:var(--ba-accent);color:var(--ba-accent-hi);background:var(--ba-accent-wash)}
.rb .bdg{position:absolute;top:2px;right:6px;font-size:10px;background:var(--ba-accent);color:var(--ba-on-accent);border-radius:9px;padding:0 5px}
.rsep{height:1px;background:var(--ba-line);margin:4px 8px}.rgrow{flex:1}
.rlab{font-size:9.5px;letter-spacing:.09em;color:var(--ba-text-3);text-align:center;margin:4px 0 0;text-transform:uppercase}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--ba-bg-0)}
.tabs{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--ba-line);align-items:center}

.cont{flex:1;min-height:0;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.drill{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;flex:1;min-height:0}

      'c-start': { n: 'Find a tape (the first tab)', p: 'The tab opens on a search. Mid-service, the volunteer types a few letters and presses one button.', render: function () { return cPage({ content: cFind('', '') }) } },
      'c-empty': { n: 'Empty library', p: 'Same page; the search is the whole story.', render: function () { return app(place({ lib: '<div class="lh"><h3>On this computer</h3></div>' + emptyNote(), tabs: tabs(['Find a tape', 'Options'], 'Find a tape'), content: cFind('', '') })) } },
      'c-type': { n: 'Typing finds sermons and says what each one needs', p: 'Each row has ONE action chosen for it: Load (already here), Add (in your folder), Download (not here yet).', render: function () { return cPage({ content: cFind('morning', cRow('99-0303M', 'Morning Light', 'On this computer · timed', btn('Load into the player', { cls: 'sm', go: 'c-have' })) + cRow('99-0404E', 'Evening Hymn Service', 'Not on this computer · English recording available', btn(I.down + ' Download', { cls: 'sm pri', go: 'c-dl' })) + cRow('99-0505M', 'Sample Sermon Two', 'In your Tape audio folder', btn('＋ Add', { cls: 'sm pri', go: 'c-added' }))) }) } },
      'c-have': { n: 'Already here: Load', p: 'Loading never plays (the rule stays).', render: function () { return cPage({ tab: 'Follow', content: follow(LIB[0]), toast: toast('', 'Loaded “Morning Light”. Press Play when you are ready.') }) } },
      'c-found': { n: 'Folder files appear as rows too', p: 'Files in the folder show with the sermon BORN thinks they are.', render: function () { return cPage({ content: cFind('', cRow('99-0404E', 'Evening Hymn Service', 'In your Tape audio folder · Evening Hymn Service.m4a', btn('＋ Add', { cls: 'sm pri', go: 'c-added' })) + cRow('?', 'mystery.mp3', 'In your Tape audio folder · sermon unknown', btn('Choose sermon…', { cls: 'sm' }))) }) } },
      'c-dl': { n: 'Download happens in the row', p: 'The row shows progress and Cancel; nothing blocks the page.', render: function () { return cPage({ content: cFind('morning', cRow('99-0404E', 'Evening Hymn Service', 'Downloading — 17 of 29 MB<div class="prog" style="width:220px;margin-top:4px"><i style="width:58%"></i></div>', btn('Cancel', { cls: 'sm' }))) }) } },
      'c-downloading': { n: 'Downloading', p: 'See previous.', render: function () { return C.screens['c-dl'].render() } },
      'c-added': { n: 'Added: the row turns into Load', p: 'Lands on Follow with the same “plays now; text follows” banner.', render: function () { return cPage({ items: LIB.concat([NEW]), sel: 'r4', chips: { r4: chip('warn', 'Timing… 8%') }, tab: 'Follow', content: follow(LIB[0], aFollowBanner(8)), toast: toast('ok', 'Added “Evening Hymn Service” · plays now') }) } },
      'c-err': { n: 'Errors are in the row', p: 'The row says what happened and offers the next move; other rows are untouched.', render: function () { return cPage({ content: cFind('evening', cRow('99-0404E', 'Evening Hymn Service', '<span style="color:var(--ba-danger)">The download site did not answer. Nothing was added.</span>', btn('Try again', { cls: 'sm pri' }) + btn('Download page', { cls: 'sm q' }))) }) } }
    }
  }

  // =====================================================================================================================
  // OPTION D — Tidy only: the same tab, two cards, honest wording
  // =====================================================================================================================
  function dAdd(found) { return '<div class="tpc" style="overflow:auto"><div class="c2"><h4>' + I.head + ' Add a recording</h4><div class="row">' + btn(I.up + ' Choose a file…', { cls: 'pri', go: 'd-added' }) + '<span class="faint">or drop it anywhere on this page</span></div></div><div class="c2"><h4>' + I.globe + ' Get a recording</h4><div class="row"><span class="fld ph" style="flex:1">Type a title or a date code</span>' + btn(I.down + ' Download', { cls: '', go: 'd-dl' }) + '</div></div><p class="faint" style="margin:2px 4px">' + (found ? '<b style="color:var(--ba-accent-hi)">2 new files in ' + FOLDER + '</b> ' + btn('Add them', { cls: 'sm pri', go: 'd-added' }) : FOLDER + ' · nothing new') + ' · <u>Change folder</u></p></div>' }
  function dPage(o) { o = o || {}; var items = o.items || LIB; return app(place({ lib: libList(items, o.sel || 'r1', o.chips), tabs: tabs(['Follow', 'Timing', 'Options', 'Add'], o.tab || 'Add'), content: o.content, toast: o.toast }), { tape: LIB[0] }) }
  var D = {
    scenarios: { 'Add one file': ['d-add', 'd-added'], 'New file in the folder': ['d-found', 'd-added'], 'Download': ['d-add', 'd-dl', 'd-added'], 'Errors': ['d-err'] },
    screens: {
      'd-add': { n: 'Add tab, tidied', p: 'Two cards instead of three. The left-hand duplicate button and the welcome note are removed; “Look again” goes (the folder is read when the page opens); the folder is a line.', render: function () { return dPage({ content: dAdd(false) }) } },
      'd-found': { n: 'A line says files are waiting', p: 'One line, one button. No list.', render: function () { return dPage({ content: dAdd(true) }) } },
      'd-dl': { n: 'Download', p: 'Progress shows in the card.', render: function () { return dPage({ content: '<div class="tpc"><div class="c2"><h4>' + I.globe + ' Downloading 99-0404E</h4><div class="prog"><i style="width:46%"></i></div><div class="row"><span class="faint">17 of 29 MB</span>' + btn('Cancel', { cls: 'sm' }) + '</div></div></div>' }) } },
      'd-added': { n: 'Added', p: 'Selected, on Follow.', render: function () { return dPage({ items: LIB.concat([NEW]), sel: 'r4', chips: { r4: chip('warn', 'Timing… 8%') }, tab: 'Follow', content: follow(LIB[0], aFollowBanner(8)), toast: toast('ok', 'Added “Evening Hymn Service” · plays now') }) } },
      'd-err': { n: 'Error', p: 'A message line at the top of the tab.', render: function () { return dPage({ content: '<div class="tpc"><div class="bn bad"><span>The download site did not answer. Nothing was added.</span></div>' + dAdd(false).replace('<div class="tpc" style="overflow:auto">', '') }) } }
    }
  }
  var OPTS = { today: TODAY, a: A, b: B, c: C, d: D }

  // ---- the demo player
  function demo(root) {
    var key = root.dataset.opt, O = OPTS[key]
    var names = Object.keys(O.scenarios)
    var scen = qs.get('scen') || names[0], idx = +(qs.get('i') || 0)
    if (qs.get('screen')) { for (var k in O.scenarios) { var j = O.scenarios[k].indexOf(qs.get('screen')); if (j >= 0) { scen = k; idx = j; break } } }
    function cur() { return O.scenarios[scen][idx] }
    function go(name) { var s = O.scenarios[scen].indexOf(name); if (s >= 0) idx = s; else { for (var k in O.scenarios) { var j = O.scenarios[k].indexOf(name); if (j >= 0) { scen = k; idx = j; break } } if (O.scenarios[scen].indexOf(name) < 0) { O.scenarios[scen] = O.scenarios[scen].slice(); O.scenarios[scen].push(name); idx = O.scenarios[scen].length - 1 } } draw() }
    function draw() {
      var sc = O.screens[cur()]
      $('.scen', root).innerHTML = names.map(function (n) { return '<button aria-pressed="' + (n === scen) + '" data-scen="' + n + '">' + n + '</button>' }).join('')
      $('.frame', root).innerHTML = sc.render()
      $('.narr', root).innerHTML = '<div class="stepn">' + scen + ' · step ' + (idx + 1) + ' of ' + O.scenarios[scen].length + '</div><h3>' + sc.n + '</h3><p>' + sc.p + '</p><div class="row" style="margin-top:10px"><button class="btn sm" data-nav="-1"' + (idx === 0 ? ' disabled' : '') + '>‹ Back</button><button class="btn sm pri" data-nav="1"' + (idx >= O.scenarios[scen].length - 1 ? ' disabled' : '') + '>Next ›</button></div><p class="faint" style="font-size:12px">You can also click the buttons inside the picture.</p>'
      fit()
    }
    root.addEventListener('click', function (e) {
      var t = e.target.closest('[data-scen],[data-nav],[data-go]'); if (!t) return
      e.preventDefault()
      if (t.dataset.scen) { scen = t.dataset.scen; idx = 0; draw() }
      else if (t.dataset.nav) { idx = Math.max(0, Math.min(O.scenarios[scen].length - 1, idx + +t.dataset.nav)); draw() }
      else if (t.dataset.go) { var g = t.dataset.go; if (g.indexOf('tab:') === 0) return; if (g) go(g) }
    })
    draw()
  }
  $$('[data-opt]').forEach(demo)
  window.addEventListener('load', fit); setTimeout(fit, 0)

  // ---- the review board
  var board = $('#board')
  if (board) {
    var KEY = 'ba-tape-add-decisions-v1', saved = {}
    try { saved = JSON.parse(store.get(KEY) || '{}') } catch (e) { saved = {} }
    var cards = $$('[data-pid]', board), save = function () { store.set(KEY, JSON.stringify(saved)) }
    var summary = function () { var c = { approve: 0, reject: 0, discuss: 0, open: 0 }; cards.forEach(function (card) { var d = saved[card.dataset.pid]; c[d && d.v ? d.v : 'open']++ }); $('#sum-approve').textContent = c.approve; $('#sum-reject').textContent = c.reject; $('#sum-discuss').textContent = c.discuss; $('#sum-open').textContent = c.open }
    cards.forEach(function (card) {
      var id = card.dataset.pid, d = saved[id] = saved[id] || { v: '', n: '' }
      var show = function () { $$('[data-v]', card).forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === d.v)) }) }
      show(); $('textarea', card).value = d.n || ''
      $$('[data-v]', card).forEach(function (b) { b.addEventListener('click', function () { d.v = d.v === b.dataset.v ? '' : b.dataset.v; show(); save(); summary() }) })
      $('textarea', card).addEventListener('input', function (e) { d.n = e.target.value; save() })
    })
    summary()
    $('#copy').addEventListener('click', function () {
      var lines = ['My decisions on the Tape “Add” redesign:']
      cards.forEach(function (card) { var d = saved[card.dataset.pid] || {}; lines.push(card.dataset.pid + ' ' + card.dataset.title + ' — ' + ({ approve: 'APPROVE', reject: 'REJECT', discuss: 'DISCUSS' }[d.v] || 'NO DECISION') + (d.n ? ' — ' + d.n.replace(/\s+/g, ' ') : '')) })
      var txt = lines.join('\n'), out = $('#out'); out.value = txt; out.hidden = false; out.select()
      var done = function () { $('#copied').textContent = 'Copied — paste it back to Claude.' }
      try { navigator.clipboard.writeText(txt).then(done, function () { $('#copied').textContent = 'Select the text below and copy it.' }) } catch (e) { $('#copied').textContent = 'Select the text below and copy it.' }
    })
    $('#reset').addEventListener('click', function () { if (confirm('Clear all decisions on this page?')) { saved = {}; save(); location.reload() } })
  }
})()
</script></body></html>
